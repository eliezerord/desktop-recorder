<!doctype html>
<meta charset="utf-8">
<title>Moving export spike</title>
<video id="screen" muted preload="auto"></video>
<video id="reader" muted preload="auto"></video>
<script type="module">
// The renderer side of test/spikes/moving-export.js. It draws frames with the Editor preview's own code
// (src/preview.mjs drawFrame, src/look.mjs drawBase), with the Card moving from the whole canvas to its place.
import { drawFrame } from '../../src/preview.mjs';
import { drawBase } from '../../src/look.mjs';

const { ipcRenderer } = window.require('electron'); // the spike window runs with Node; a module has no bare require
const FPS = 30;
const screen = document.getElementById('screen');
const reader = document.getElementById('reader');
let plan = null;
let canvas = null;
let ctx = null;

const smooth = (u) => { const c = Math.min(1, Math.max(0, u)); return c * c * (3 - 2 * c); };
const lerp = (a, b, e) => a + (b - a) * e;
// The Card at a moment: the whole canvas with square corners until the move starts, then eased to its place.
function cardAt(tMs) {
  const e = smooth((tMs - plan.move.startMs) / plan.move.lengthMs);
  const { card, canvas: c } = plan;
  return { x: lerp(0, card.x, e), y: lerp(0, card.y, e), w: lerp(c.w, card.w, e), h: lerp(c.h, card.h, e), r: lerp(0, card.r, e) };
}

const seek = (video, sec) => new Promise((resolve) => {
  const done = () => { video.removeEventListener('seeked', done); resolve(); };
  video.addEventListener('seeked', done);
  video.currentTime = sec;
});
const loaded = (video, url) => new Promise((resolve, reject) => {
  video.onloadeddata = () => resolve();
  video.onerror = () => reject(new Error(`could not open ${url}`));
  video.src = url;
});

function drawAt(tMs) {
  drawFrame(ctx, { plan: { ...plan, card: cardAt(tMs) }, screen, camera: null, picture: null, tMs });
}

window.spike = {
  async setup(p) {
    plan = p;
    canvas = document.createElement('canvas');
    canvas.width = plan.canvas.w;
    canvas.height = plan.canvas.h;
    ctx = canvas.getContext('2d', { willReadFrequently: Boolean(plan.readFrequently) });
    await loaded(screen, plan.screenUrl);
    return { w: screen.videoWidth, h: screen.videoHeight, duration: screen.duration };
  },

  // The fixed layers Way B needs, as PNG data URLs: the Background with the Card's shadow at its final place,
  // and a canvas-size white mask with the corner radius that becomes the Card's radius once shrunk, with a
  // black edge so ffmpeg's perspective filter repeats black outside it.
  layers() {
    const c = document.createElement('canvas');
    c.width = plan.canvas.w;
    c.height = plan.canvas.h;
    const x = c.getContext('2d');
    drawBase(x, { canvas: plan.canvas, backgroundId: plan.look.background, backgroundImage: null, card: plan.card, shadow: plan.shadow });
    const base = c.toDataURL('image/png');
    x.fillStyle = '#000';
    x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#fff';
    x.beginPath();
    x.roundRect(1, 1, c.width - 2, c.height - 2, (plan.card.r * plan.canvas.w) / plan.card.w);
    x.fill();
    return { base, mask: c.toDataURL('image/png') };
  },

  // Way A: every frame drawn here and handed to the main process, which feeds ffmpeg. Times are summed per step.
  async exportAll(frames) {
    const t = { seek: 0, draw: 0, read: 0, send: 0 };
    for (let n = 0; n < frames; n++) {
      const tMs = ((n + 0.5) * 1000) / FPS;
      let a = performance.now();
      await seek(screen, tMs / 1000);
      let b = performance.now(); t.seek += b - a; a = b;
      drawAt(tMs);
      b = performance.now(); t.draw += b - a; a = b;
      const px = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      b = performance.now(); t.read += b - a; a = b;
      await ipcRenderer.invoke('spike-frame', px);
      b = performance.now(); t.send += b - a;
    }
    return t;
  },

  // Way A2: the same drawing, but the screen's frames come decoded in order from ffmpeg in the main process,
  // instead of seeking the <video> for each one.
  async exportFromFrames(frames) {
    const t = { fetch: 0, put: 0, draw: 0, read: 0, send: 0 };
    const src = document.createElement('canvas');
    src.width = plan.screenSize.w;
    src.height = plan.screenSize.h;
    src.videoWidth = src.width; // drawFrame reads the source's size as a <video> gives it
    src.videoHeight = src.height;
    const sctx = src.getContext('2d');
    const image = new ImageData(src.width, src.height);
    // The next screen frame is asked for while this one is drawn, and a finished frame is sent while the
    // next is drawn, so the steps overlap (one of each in flight).
    let next = ipcRenderer.invoke('spike-next-screen');
    let sending = Promise.resolve();
    for (let n = 0; n < frames; n++) {
      const tMs = ((n + 0.5) * 1000) / FPS;
      let a = performance.now();
      const px = await next;
      if (n + 1 < frames) next = ipcRenderer.invoke('spike-next-screen');
      let b = performance.now(); t.fetch += b - a; a = b;
      image.data.set(px);
      sctx.putImageData(image, 0, 0);
      b = performance.now(); t.put += b - a; a = b;
      drawFrame(ctx, { plan: { ...plan, card: cardAt(tMs) }, screen: src, camera: null, picture: null, tMs });
      b = performance.now(); t.draw += b - a; a = b;
      const out = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      b = performance.now(); t.read += b - a; a = b;
      await sending;
      sending = ipcRenderer.invoke('spike-frame', out);
      b = performance.now(); t.send += b - a;
    }
    await sending;
    return t;
  },

  // A preview frame at frame n, shrunk to w x h, as base64 RGBA (the reference both exports are compared to).
  async preview(n, w, h) {
    const tMs = ((n + 0.5) * 1000) / FPS;
    await seek(screen, tMs / 1000);
    drawAt(tMs);
    return shrink(canvas, w, h);
  },

  // Frame n of an exported MP4, decoded by Chromium the way a player shows it, shrunk the same way.
  async exported(url, n, w, h) {
    if (reader.dataset.url !== url) { reader.dataset.url = url; await loaded(reader, url); }
    await seek(reader, (n + 0.5) / FPS);
    return shrink(reader, w, h);
  },
};

function shrink(source, w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(source, 0, 0, w, h);
  const px = x.getImageData(0, 0, w, h).data;
  let bin = '';
  for (let i = 0; i < px.length; i += 0x8000) bin += String.fromCharCode(...px.subarray(i, i + 0x8000));
  return btoa(bin);
}
window.spikeReady = true;
</script>
