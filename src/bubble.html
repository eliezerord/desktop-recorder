<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'">
  <title>Burbuja</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .bubble {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #15161a;
      cursor: grab;
    }
    .bubble:active { cursor: grabbing; }
    body.ring .bubble { border: var(--ring-width, 4px) solid var(--ring, #ffffff); }
    body.full .bubble { border-radius: 18px; cursor: default; }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror, like looking in a mirror */
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="bubble" id="bubble"><canvas id="cam"></canvas></div>
  <script type="module" src="bubble.js"></script>
</body>
</html>
