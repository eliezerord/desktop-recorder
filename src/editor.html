<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data: file:; media-src file:; style-src 'self'">
  <title>Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- Texts come from i18n.js (data-i18n, data-i18n-label). The preview is drawn by preview.mjs, the same steps as Export. -->
  <header class="bar">
    <h1 id="projectName"></h1>
    <p class="status" id="status" role="status"></p>
    <button class="primary" id="export" data-i18n="editor.export"></button>
  </header>

  <div class="layout">
    <section class="stage">
      <div class="frame"><canvas id="preview"></canvas></div>
      <div class="transport">
        <!-- Both icons stay in the button and cross-fade; editor.js sets its label (Play or Pause). -->
        <button class="icon-button" id="play">
          <svg class="icon i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.6v8.8a.6.6 0 0 0 .9.5l7-4.4a.6.6 0 0 0 0-1l-7-4.4a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>
          <svg class="icon i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.75" y="3" width="3" height="10" rx="1" fill="currentColor"/><rect x="9.25" y="3" width="3" height="10" rx="1" fill="currentColor"/></svg>
        </button>
        <input type="range" id="scrub" min="0" max="1000" step="1" value="0">
        <span class="time" id="time">0:00.0</span>
      </div>
      <!-- The timeline: the whole recording. Its rows are labelled on the left: the video (its trim), the Layouts
           and the Zooms. Drag a trim handle to set the start or end, drag a Layout's start to move it, drag a Zoom
           block to move it or one of its edges to change its length; arrow keys do the same on a focused one. -->
      <div class="tracks">
        <span class="track-label row-video" data-i18n="editor.trackVideo"></span>
        <span class="track-label row-layout" data-i18n="editor.trackLayout"></span>
        <span class="track-label row-zoom" data-i18n="editor.trackZoom"></span>
        <div class="timeline" id="timeline" role="group">
          <div class="row-band row-video"></div>
          <div class="cut before" id="cutBefore"></div>
          <div class="cut after" id="cutAfter"></div>
          <button class="trim start" id="trimStart" data-side="start"></button>
          <button class="trim end" id="trimEnd" data-side="end"></button>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
    </section>

    <aside class="controls">
      <section>
        <h2 data-i18n="editor.format"></h2>
        <div class="segmented" id="aspect">
          <button data-aspect="16:9">16:9</button>
          <button data-aspect="9:16">9:16</button>
        </div>
        <p class="hint" data-i18n="editor.formatHint"></p>
      </section>

      <!-- Layouts: how the screen and the camera share the video from each point on. Each kind button shows it;
           the timeline segments reuse these drawings. -->
      <section>
        <h2 data-i18n="editor.layout"></h2>
        <button id="layoutAdd" data-i18n="editor.layoutAdd"></button>
        <div class="selected" id="layoutSelected" hidden>
          <p class="pick-title" id="layoutTitle"></p>
          <div class="kinds" id="layoutKind">
            <button data-kind="card"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5" y="5.25" width="6.5" height="4" rx="1" fill="currentColor"/><circle cx="4.5" cy="10.75" r="1.25" fill="currentColor"/></svg><span data-i18n="editor.layoutCard"></span></button>
            <button data-kind="screen"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.75" y="4.75" width="8.5" height="6.5" rx="1" fill="currentColor"/></svg><span data-i18n="editor.layoutScreen"></span></button>
            <button data-kind="camera"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="6.5" r="1.75" fill="currentColor"/><path d="M5 12.25c.5-1.6 1.6-2.5 3-2.5s2.5.9 3 2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span data-i18n="editor.layoutCamera"></span></button>
            <!-- Split has two drawings: side by side in 16:9, one above the other in 9:16 (editor.js shows the one in use). -->
            <button data-kind="split"><svg class="icon" data-aspect="16:9" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 3v10" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.75" y="5.75" width="4" height="4.5" rx="0.75" fill="currentColor"/><circle cx="11.75" cy="8" r="1.25" fill="currentColor"/></svg><svg class="icon" data-aspect="9:16" viewBox="0 0 16 16" aria-hidden="true" hidden><rect x="3.25" y="1.25" width="9.5" height="13.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5.25" y="3.25" width="5.5" height="3" rx="0.75" fill="currentColor"/><circle cx="8" cy="11.25" r="1.25" fill="currentColor"/></svg><span data-i18n="editor.layoutSplit"></span></button>
          </div>
          <div class="segmented">
            <button id="layoutSwap" data-i18n="editor.layoutSwap" hidden></button>
            <button id="layoutDelete" data-i18n="editor.layoutDelete"></button>
          </div>
        </div>
        <p class="hint" id="layoutHint"></p>
      </section>

      <section>
        <h2 data-i18n="editor.background"></h2>
        <div class="swatches" id="backgrounds"></div>
        <button id="picture" data-i18n="editor.picture"></button>
        <p class="hint" id="pictureNote"></p>
      </section>

      <section>
        <h2 data-i18n="editor.card"></h2>
        <label class="slider"><span data-i18n="editor.margin"></span> <output id="marginValue"></output>
          <input type="range" id="margin" step="0.5"></label>
        <label class="slider"><span data-i18n="editor.corners"></span> <output id="cornersValue"></output>
          <input type="range" id="cardCorners" step="0.2"></label>
      </section>

      <section id="bubbleSection" hidden>
        <h2 data-i18n="editor.bubble"></h2>
        <div class="segmented" id="bubblePlace">
          <button data-place="inside" data-i18n="editor.bubbleInside"></button>
          <button data-place="outside" data-i18n="editor.bubbleOutside"></button>
        </div>
        <!-- The camera's shape: each button shows it. -->
        <div class="segmented" id="bubbleShape">
          <button data-shape="circle"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.75" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span data-i18n="editor.bubbleCircle"></span></button>
          <button data-shape="rounded"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.25" y="2.25" width="11.5" height="11.5" rx="2.75" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span data-i18n="editor.bubbleRounded"></span></button>
        </div>
        <!-- Each icon is the frame with a dot in that corner. -->
        <div class="corners" id="bubbleCorner">
          <button data-corner="top-left" data-i18n-label="editor.cornerTopLeft"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5.25" cy="6.25" r="1.75" fill="currentColor"/></svg></button>
          <button data-corner="top-right" data-i18n-label="editor.cornerTopRight"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10.75" cy="6.25" r="1.75" fill="currentColor"/></svg></button>
          <button data-corner="bottom-left" data-i18n-label="editor.cornerBottomLeft"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5.25" cy="9.75" r="1.75" fill="currentColor"/></svg></button>
          <button data-corner="bottom-right" data-i18n-label="editor.cornerBottomRight"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10.75" cy="9.75" r="1.75" fill="currentColor"/></svg></button>
        </div>
        <label class="slider"><span data-i18n="editor.bubbleSize"></span> <output id="bubbleSizeValue"></output>
          <input type="range" id="bubbleSize" step="0.5"></label>
        <p class="hint" data-i18n="editor.bubbleHint"></p>
      </section>

      <section>
        <h2 data-i18n="editor.zoom"></h2>
        <label class="switch"><input type="checkbox" id="zoomOn"> <span data-i18n="editor.zoomOn"></span></label>
        <button id="zoomAdd" data-i18n="editor.zoomAdd"></button>
        <div class="selected" id="zoomSelected" hidden>
          <label class="slider"><span id="zoomTitle"></span> <output id="zoomStrengthValue"></output>
            <input type="range" id="zoomStrength" step="0.1"></label>
          <button id="zoomDelete" data-i18n="editor.zoomDelete"></button>
          <p class="hint" data-i18n="editor.zoomAim"></p>
        </div>
        <p class="hint" id="zoomHint"></p>
      </section>

      <p class="hint" data-i18n="editor.saved"></p>
    </aside>
  </div>

  <video id="screen" preload="auto" hidden></video>
  <video id="camera" preload="auto" muted hidden></video>
  <script src="i18n.js"></script>
  <script type="module" src="editor.js"></script>
</body>
</html>
